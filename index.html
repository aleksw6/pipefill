<style>
:root {
  /* Layout: one phone-width column; the conduit cross-section drawn to scale is the hero, everything else stays quiet. */
  --bg: #e9ecef;
  --surface: #ffffff;
  --ink: #12171c;
  --muted: #55606c;
  --line: #cdd4db;
  --accent: #1746d1;
  --on-accent: #ffffff;
  --ok: #17794a;
  --over: #c22a2a;
  --warn: #9a5200;
  --warn-bg: #fff3df;
  --over-bg: #fdeaea;
  --steel: #9aa5b0;
  --c1: #2f6fde; --c2: #d9822b; --c3: #2a9d8f; --c4: #8a56c2; --c5: #c44569; --c6: #6b7b3a;
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --num: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1317; --surface: #181d23; --ink: #e9eef3; --muted: #97a3b0; --line: #2c353f;
    --accent: #7ea2ff; --on-accent: #0b1020; --ok: #4fc78f; --over: #ff7474; --warn: #f2ad55;
    --warn-bg: #2e2413; --over-bg: #321a1a; --steel: #5d6975;
    --c1: #6c9cff; --c2: #f0a253; --c3: #4cc7b7; --c4: #b48ae6; --c5: #ee7c9c; --c6: #a3b866;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1317; --surface: #181d23; --ink: #e9eef3; --muted: #97a3b0; --line: #2c353f;
  --accent: #7ea2ff; --on-accent: #0b1020; --ok: #4fc78f; --over: #ff7474; --warn: #f2ad55;
  --warn-bg: #2e2413; --over-bg: #321a1a; --steel: #5d6975;
  --c1: #6c9cff; --c2: #f0a253; --c3: #4cc7b7; --c4: #b48ae6; --c5: #ee7c9c; --c6: #a3b866;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.4 var(--body);
  display: flex; flex-direction: column;
  -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { flex: none; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 10px 16px 6px; max-width: 520px; width: 100%; margin: 0 auto; }
.top h1 { margin: 0; font: 800 26px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; }
.top .sub { font: 500 11px/1 var(--mono); color: var(--muted); letter-spacing: .04em; }

main { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.view { max-width: 520px; margin: 0 auto; padding: 6px 16px 24px; display: flex; flex-direction: column; gap: 14px; }
.view[hidden] { display: none; }

nav.tabs { flex: none; display: flex; background: var(--surface); border-top: 1px solid var(--line); }
nav.tabs .in { display: flex; max-width: 520px; width: 100%; margin: 0 auto; }
nav.tabs a { flex: 1; text-align: center; padding: 11px 4px 12px; text-decoration: none; color: var(--muted); font: 700 17px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; border-top: 3px solid transparent; margin-top: -1px; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-top-color: var(--accent); }

.label { font: 600 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.group { display: flex; flex-direction: column; gap: 7px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }

/* chips */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 40px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-weight: 500; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; line-height: 1.1; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip small { font: 500 10px/1 var(--mono); color: var(--muted); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .8; }
.chip small.ok { color: var(--ok); } .chip small.over { color: var(--over); }
.chip[aria-pressed="true"] small.ok, .chip[aria-pressed="true"] small.over { color: inherit; }
.chip.size { min-width: 52px; font: 600 20px/1 var(--num); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { min-height: 40px; padding: 4px 4px; font-weight: 500; font-size: 14px; border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* hero */
.hero { display: grid; grid-template-columns: 148px 1fr; gap: 14px; align-items: center; padding: 14px;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 16px 16px; background-position: -1px -1px; background-color: var(--surface); }
.hero svg { width: 148px; height: 164px; display: block; }
.hero .read { display: flex; flex-direction: column; gap: 6px; min-width: 0; background: var(--surface); padding: 8px 10px; border-radius: 8px; }
.pct { font: 700 62px/.9 var(--num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.pct sup { font-size: 26px; vertical-align: top; position: relative; top: 4px; margin-left: 2px; }
.status { align-self: flex-start; font: 700 15px/1 var(--display); letter-spacing: .1em; padding: 5px 9px 4px; border-radius: 4px; text-transform: uppercase; }
.status.ok { background: var(--ok); color: var(--surface); }
.status.over { background: var(--over); color: var(--surface); }
.status.idle { background: var(--line); color: var(--muted); }
.read .fine { font: 500 12px/1.35 var(--mono); color: var(--muted); }
.bar { position: relative; height: 10px; border-radius: 5px; background: var(--bg); border: 1px solid var(--line); overflow: visible; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--ok); max-width: 100%; }
.bar.over i { background: var(--over); }
.bar b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }

.note { display: flex; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13.5px; line-height: 1.35; border-left: 4px solid var(--warn); background: var(--warn-bg); }
.note.bad { border-left-color: var(--over); background: var(--over-bg); }
.note.info { border-left-color: var(--steel); background: var(--surface); color: var(--muted); }
.note strong { display: block; }
.note .acts { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

/* rows */
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; padding: 9px 12px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.card.rows { overflow: hidden; }
.swipe { position: relative; overflow: hidden; border-top: 1px solid var(--line); }
.swipe:first-child { border-top: 0; }
.swipe .row { position: relative; border-top: 0; background: var(--surface); touch-action: pan-y; transition: transform .2s cubic-bezier(.2,.8,.2,1); }
.swipe .del { position: absolute; top: 0; right: 0; bottom: 0; width: 100%; padding: 0 20px 0 0; text-align: right; background: var(--over); color: var(--surface); font-weight: 600; font-size: 15px; }
.row .dot { width: 10px; height: 10px; border-radius: 50%; }
.row .what { min-width: 0; text-align: left; display: flex; flex-direction: column; gap: 3px; }
.row .name { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.row .meta { font: 500 12px/1.3 var(--mono); color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.badge { font: 600 10px/1 var(--mono); letter-spacing: .06em; padding: 3px 5px; border-radius: 3px; border: 1px solid currentColor; text-transform: uppercase; white-space: nowrap; }
.badge.VERIFIED, .badge.NEC, .badge.MEASURED { color: var(--ok); }
.badge.GENERIC, .badge.USER { color: var(--warn); }
.badge.CONFLICT { color: var(--over); }
.step { display: grid; grid-template-columns: 36px 46px 36px; align-items: stretch; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.step button { height: 38px; font: 600 24px/1 var(--num); }
.step button:active { background: var(--bg); }
.step input { width: 100%; min-width: 0; border: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line); border-radius: 0; background: transparent; padding: 0; text-align: center; font: 600 22px/1 var(--num); font-variant-numeric: tabular-nums; }
.step input:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
.part { display: flex; flex-direction: column; gap: 14px; }
.btn { min-height: 44px; padding: 8px 14px; border-radius: 8px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.small { min-height: 34px; padding: 5px 10px; font-size: 13px; }
.btn.wide { width: 100%; }
.rowacts { display: flex; gap: 8px; }
.rowacts .btn.primary { flex: 1; }
.empty { padding: 18px 12px; color: var(--muted); text-align: center; font-size: 14px; }

/* form fields */
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (min-width: 500px) { .fields { grid-template-columns: repeat(4, 1fr); } }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field input[type="number"], .field input[type="text"], .search {
  width: 100%; min-height: 42px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
  font: 600 24px/1 var(--num); font-variant-numeric: tabular-nums;
}
.field input[type="text"], .search { font: 500 15px/1.2 var(--body); }
.field .step { grid-template-columns: 40px 1fr 40px; min-height: 42px; }

/* parts list */
.parts { width: 100%; border-collapse: collapse; }
.parts td { padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: baseline; }
.parts tr:first-child td { border-top: 0; }
.parts td.q { width: 64px; text-align: right; font: 700 28px/1 var(--num); font-variant-numeric: tabular-nums; }
.parts td small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
details.math { padding: 10px 12px; font-size: 13px; color: var(--muted); }
details.math summary { cursor: pointer; font-weight: 600; color: var(--ink); }
details.math p { margin: 8px 0 0; }
details.math code { font: 500 12px/1.4 var(--mono); color: var(--ink); }

/* browser */
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; }
.fgrid .chip { width: 100%; min-height: 50px; font: 600 22px/1 var(--num); }
.fgrid .chip.pair { font: 600 13px/1.1 var(--body); }
.awg { display: flex; flex-direction: column; gap: 6px; }
.vlist { display: flex; flex-direction: column; }
.v { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); text-align: left; width: 100%; align-items: center; }
.v:first-child { border-top: 0; }
.v:active { background: var(--bg); }
.v .l { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.v .l b { font-weight: 600; overflow-wrap: anywhere; }
.v .l b span { font: 500 13px/1 var(--mono); color: var(--muted); margin-left: 6px; }
.v .l small { color: var(--muted); font-size: 12px; line-height: 1.35; overflow-wrap: anywhere; }
.v .r { text-align: right; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.v .od { font: 600 15px/1 var(--mono); font-variant-numeric: tabular-nums; }
.v.gen { background: var(--bg); }
.back { align-self: flex-start; }
.famhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.famhead h2 { margin: 0; font: 700 32px/1 var(--num); letter-spacing: .02em; }
.famhead span { font: 500 12px/1.3 var(--mono); color: var(--muted); text-align: right; }

/* sheet */
.sheet { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(8, 12, 16, 0); transition: background-color .24s ease-out; }
.sheet.in { background: rgba(8, 12, 16, .5); }
.sheet[hidden] { display: none; }
.sheet .panel { background: var(--bg); border-radius: 14px 14px 0 0; max-height: 88%; display: flex; flex-direction: column; max-width: 520px; width: 100%; margin: 0 auto; transform: translateY(100%); transition: transform .24s cubic-bezier(.2,.8,.2,1); will-change: transform; }
.sheet.in .panel { transform: none; }
.sheet .grab { flex: none; height: 20px; display: grid; place-items: center; touch-action: none; cursor: grab; }
.sheet .grab::before { content: ""; width: 36px; height: 4px; border-radius: 2px; background: var(--steel); opacity: .7; }
.sheet .bar2 { flex: none; display: flex; justify-content: space-between; align-items: center; padding: 0 16px 8px; touch-action: none; }
.sheet .bar2 h2 { margin: 0; font: 800 22px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; }
.sheet .body { overflow-y: auto; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 12px; }
.toast { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 8px; font-size: 14px; font-weight: 500; z-index: 20; max-width: calc(100% - 32px); }
.toast[hidden] { display: none; }
textarea.copy { width: 100%; min-height: 150px; font: 500 13px/1.4 var(--mono); border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--surface); color: var(--ink); }
.foot { font-size: 12px; color: var(--muted); line-height: 1.45; }
/* Standing disclaimer: sits at the end of every tab's scroll, same quiet mono voice as the header subtitle. */
.legal { max-width: 520px; margin: 0 auto; padding: 0 16px 22px; text-align: center; font: 500 10.5px/1.5 var(--mono); letter-spacing: .02em; color: var(--muted); opacity: .8; }
@media (max-width: 359px) { .hero { grid-template-columns: 1fr; justify-items: center; } }
.field .step input[type="text"] { min-height: 0; border: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line); border-radius: 0; background: transparent; padding: 0; font: 600 22px/1 var(--num); }


/* ---- Refinement pass: touch response and motion. Nothing here changes layout, math or content. ---- */
* { -webkit-tap-highlight-color: transparent; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea { -webkit-user-select: text; user-select: text; }
button, a { touch-action: manipulation; }
.chip, .btn, .seg button, .step button, nav.tabs a, .row .what, .v { transition: transform .12s ease-out, opacity .12s ease-out, background-color .12s ease-out; }
.chip:active, .btn:active { transform: scale(.96); opacity: .82; }
.seg button:not([aria-pressed="true"]):active { background: var(--bg); }
.row .what:active { opacity: .5; }
nav.tabs a:active { opacity: .55; }
.hero svg circle[data-k] { transform-box: fill-box; transform-origin: center; }
.toast:not([hidden]) { animation: toast-in .18s ease-out; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 6px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ---- Pipe tab: choice rows with native pop-up menus ---- */
.setlist { display: flex; flex-direction: column; }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; padding: 0 4px 0 12px; border-top: 1px solid var(--line); }
.setrow:first-child { border-top: 0; }

  font: 500 15px/1.2 var(--body); color: var(--ink); text-align: right; text-align-last: right; text-overflow: ellipsis; }

.setnote { padding: 0 12px 10px; margin-top: -4px; font-size: 12px; line-height: 1.35; color: var(--muted); }
.setrow .fixed { padding: 0 10px 0 0; color: var(--muted); font-size: 14px; text-align: right; }
.setrow input.mini { width: 84px; min-height: 36px; margin-right: 8px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); text-align: right; font: 600 20px/1 var(--num); font-variant-numeric: tabular-nums; }

/* Seven pipe types across one row */
.seg.types button { font-size: 13px; padding: 4px 1px; letter-spacing: -.01em; }

/* ---- Part pictures in the buy list (Pipe tab) ---- */
.parts td.ic { width: 30px; padding-left: 0; padding-right: 0; vertical-align: middle; }
.parts td.q { vertical-align: middle; width: 56px; }
.pic { display: block; width: 30px; height: 30px; }
.pic svg { display: block; width: 100%; height: 100%; }
.pic .p { fill: none; stroke: var(--steel); stroke-width: 4; }

.pic .f { fill: var(--surface); stroke: var(--ink); stroke-width: 1.2; stroke-linejoin: round; }

.top { padding-top: calc(10px + env(safe-area-inset-top)); padding-left: calc(16px + env(safe-area-inset-left)); padding-right: calc(16px + env(safe-area-inset-right)); }

<script>
/* Pipe Fill core math. Pure functions, no DOM. */
const Core = (() => {
  // NEC Table 352.30: max support spacing for rigid PVC, feet
  const PVC_SPAN = { '1/2': 3, '3/4': 3, '1': 3, '1-1/4': 5, '1-1/2': 5, '2': 5, '2-1/2': 6, '3': 6, '3-1/2': 7, '4': 7, '5': 7, '6': 8 };
  const STICK = 10;      // ft per stick
  const END = 3;         // ft: support required within this distance of each box

  const area = od => Math.PI / 4 * od * od;

  // NEC Ch.9 Table 1. A multiconductor cable counts as one conductor (Note 9).
  const limitPct = n => (n === 1 ? 53 : n === 2 ? 31 : 40);

  function fill(items, pipeArea) {
    let n = 0, used = 0;
    for (const it of items) { n += it.qty; used += it.area * it.qty; }
    const pct = limitPct(n);
    const allowed = pipeArea * pct / 100;
    return { n, used, pct, allowed, fillPct: pipeArea ? used / pipeArea * 100 : 0, pass: used <= allowed + 1e-9 };
  }

  // index of the smallest size that passes, or -1
  function autoSize(items, sizes) {
    for (let i = 0; i < sizes.length; i++) if (fill(items, sizes[i][2]).pass) return i;
    return -1;
  }

  // how many more cables of area a fit alongside what is already there
  function roomFor(items, a, pipeArea) {
    const base = fill(items, pipeArea);
    let best = 0;
    for (let k = 1; k <= 400; k++) {
      const n = base.n + k, used = base.used + k * a;
      if (used <= pipeArea * limitPct(n) / 100 + 1e-9) best = k;
      else if (n >= 3) break;
    }
    return best;
  }

  const supportSpan = (type, size) => (type.startsWith('PVC') ? (PVC_SPAN[size] || 3) : 10);

  // Worst-case support count for L feet split into S box-to-box segments, in any proportion.
  // One segment of length l needs 1 support if l <= 2*END (one strap is within 3 ft of both boxes),
  // otherwise 2 end supports plus intermediates: 1 + ceil((l - 2*END) / span).
  function supports(L, S, span) {
    if (!(L > 0) || S < 1) return 0;
    let best = S;
    for (let m = 1; m <= S; m++) {
      const gap = L - 2 * END * m;
      if (gap > 0) best = Math.max(best, S + Math.ceil(gap / span - 1e-9) + m - 1);
    }
    return best;
  }

  // Worst case for a run: L feet, B boxes (both ends counted), E factory elbows, N conduit bodies (LBs).
  // A conduit body is a termination like a box (support within 3 ft each side), so each one adds a section.
  function pipeParts(L, B, E, span, N) {
    N = N || 0;
    const S = Math.max(1, B - 1 + N);
    if (!(L > 0)) return { S, sticks: 0, couplings: 0, terms: 0, termsBox: 0, termsBody: 0, elbows: 0, bodies: 0, supports: 0 };
    const sticks = Math.ceil(L / STICK - 1e-9) + (S - 1);
    return {
      S,
      sticks,
      couplings: Math.max(0, sticks - S) + 2 * E,
      terms: 2 * S,
      termsBox: 2 * S - 2 * N,
      termsBody: 2 * N,
      elbows: E,
      bodies: N,
      supports: supports(L, S, span),
    };
  }

  // Greedy gravity packing of circles (radii) into a circle of radius R centred on 0,0. y grows downward.
  // Returns [{x,y,r,i}] for the ones that fit, plus the count that did not.
  function pack(R, radii) {
    const order = radii.map((r, i) => ({ r, i })).sort((a, b) => b.r - a.r);
    const placed = [];
    let failed = 0;
    const EPS = 1e-7;
    const ok = (x, y, r) => {
      if (Math.hypot(x, y) > R - r + EPS) return false;
      for (const p of placed) if (Math.hypot(x - p.x, y - p.y) < p.r + r - EPS) return false;
      return true;
    };
    // intersections of circle (ax,ay,ar) and (bx,by,br)
    const meet = (ax, ay, ar, bx, by, br) => {
      const dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy);
      if (d < 1e-12 || d > ar + br || d < Math.abs(ar - br)) return [];
      const a = (ar * ar - br * br + d * d) / (2 * d);
      const h = Math.sqrt(Math.max(0, ar * ar - a * a));
      const mx = ax + a * dx / d, my = ay + a * dy / d;
      return [[mx + h * dy / d, my - h * dx / d], [mx - h * dy / d, my + h * dx / d]];
    };
    for (const c of order) {
      const r = c.r;
      if (r > R) { failed++; continue; }
      const cand = [[0, R - r]];
      for (let i = 0; i < placed.length; i++) {
        const p = placed[i];
        cand.push(...meet(0, 0, R - r, p.x, p.y, p.r + r));
        for (let j = i + 1; j < placed.length; j++) {
          const q = placed[j];
          cand.push(...meet(p.x, p.y, p.r + r, q.x, q.y, q.r + r));
        }
      }
      let best = null;
      for (const [x, y] of cand) {
        if (!ok(x, y, r)) continue;
        if (!best || y > best[1] + 1e-9 || (Math.abs(y - best[1]) <= 1e-9 && Math.abs(x) < Math.abs(best[0]))) best = [x, y];
      }
      if (best) placed.push({ x: best[0], y: best[1], r, i: c.i });
      else failed++;
    }
    return { placed, failed };
  }

  return { area, limitPct, fill, autoSize, roomFor, supportSpan, supports, pipeParts, pack, PVC_SPAN };
})();
if (typeof module !== 'undefined') module.exports = Core;

        ['ss', 'Set-screw' + (P.where === 'out' ? ' · not listed for wet' : P.where === 'con' ? ' · if concrete-tight' : ' · code minimum')],
        ['comp', 'Compression' + (P.where === 'out' ? ' · code minimum' : '')]], P.connEMT, x => set('connEMT', x)))
        : t.startsWith('PVC') ? row('Fittings', h('span', { class: 'fixed' }, 'Cemented, adapters at boxes'))
          : row('Fittings', sel('pfit', 'Fittings', [['thr', 'Threaded · code minimum'],
            ['tl', 'Threadless' + (P.where === 'out' ? ' · if listed for wet' : P.where === 'con' ? ' · if concrete-tight' : '')]], P.connRigid, x => set('connRigid', x))),
      row('Hung by', sel('pmount', 'Hung by', [['one', '1-hole strap'], ['two', '2-hole strap'], ['mini', 'Mini'], ['strut', 'Strut strap'], ['rod', 'Rod hanger']], P.mount, x => set('mount', x))),
      P.mount === 'rod' && row('Drop, feet', h('input', { id: 'drop', class: 'mini', type: 'number', inputmode: 'decimal', min: '0.25', step: '0.5', value: P.drop, 'aria-label': 'Drop in feet', onfocus: e => e.target.select(), oninput: e => { P.drop = e.target.value === '' ? '' : Math.max(0, parseFloat(e.target.value) || 0); save(); renderPipeOut(); } }))),
      boxNote()));
    kids.push(h('div', { class: 'group' }, h('span', { class: 'label' }, 'Buy list · worst case'), h('div', { class: 'group', id: 'pipe-out', style: 'gap:10px' })));
    v.replaceChildren(...kids);
    renderPipeOut();
  }

  // ---------- Cables tab ----------
  function renderCables() {
    const v = $('cables');
    if (v.dataset.ready) return;
    v.dataset.ready = '1';
    const n = D.fam.reduce((a, f) => a + f.v.length, 0);
    v.append(h('div', { class: 'foot' }, n + ' cables with ODs from manufacturer sheets. Tap a size to see every brand on file, then tap one to put it in the pipe.'));
    const holder = h('div', { class: 'group', style: 'gap:12px' });
    v.append(holder);
    makeBrowser(holder, { id: 'cat', detail: true, onPick: e => { addRow(e); renderFill(); toast('Added ' + e.name + ' to Fill'); } });
    v.append(h('div', { class: 'foot' },
      h('strong', {}, 'Badges. '), 'Verified: OD from a manufacturer sheet. Generic: largest verified OD for that size, rounded up to 0.005″. Conflict: the catalog prints two ODs for one part. Measured and User: ODs you typed in under Other OD.', h('br'), h('br'),
      'Sheet ODs are nominal. Conduit and THHN areas are NEC Chapter 9 Tables 4 and 5. Catalog built ' + D.built + '.'));
  }

  // ---------- shell ----------
  const TABS = ['fill', 'pipe', 'cables'];
  const scrollAt = {}; let curTab = null;
  function showTab() {
    const t = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'fill';
    const main = document.querySelector('main');
    if (curTab) scrollAt[curTab] = main.scrollTop;   // each tab keeps its own place
    for (const id of TABS) { $(id).hidden = id !== t; document.querySelector('nav.tabs a[href="#' + id + '"]').setAttribute('aria-current', id === t ? 'page' : 'false'); }
    if (t === 'cables') renderCables();
    main.scrollTop = scrollAt[t] || 0;
    if (curTab && curTab !== t) anim($(t), [{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], 180);
    curTab = t;
  }
  function renderAll() { renderFill(); renderPipe(); }
  window.addEventListener('hashchange', showTab);
  renderAll(); showTab();
})();

</script>
<div class="upd" id="upd" role="status" hidden><span>Pipe Fill updated. Reload to use it.</span><button type="button" id="upd-go">Reload</button></div>
<script>
if ('serviceWorker' in navigator && window.isSecureContext) {
  let had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(function () {});
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!had) { had = true; return; }          // first install: nothing to announce
    document.getElementById('upd').hidden = false;
  });
  document.getElementById('upd-go').onclick = function () { location.reload(); };
}
</script>
